<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — LibraryBandhu</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050913; color: #e8ecf5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { margin: 8px 0 0; font-size: 20px; }
      p { margin: 0; max-width: 320px; color: #9aa3b8; font-size: 14px; line-height: 1.5; }
      button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px;
        background: #e8ecf5; color: #050913; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>LibraryBandhu needs an internet connection. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
