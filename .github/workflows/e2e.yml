name: E2E

# Public-page tests run on every pull request and push to main (read-only).
# The owner flow writes to the live database, so it only runs when started by hand:
# Actions → E2E → Run workflow → tick "Run the owner flow". See e2e/README.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      owner_flow:
        description: "Run the owner flow (uses the E2E test owner account)"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        run: bun run test:e2e
        env:
          E2E_OWNER_EMAIL: ${{ inputs.owner_flow && secrets.E2E_OWNER_EMAIL || '' }}
          E2E_OWNER_PASSWORD: ${{ inputs.owner_flow && secrets.E2E_OWNER_PASSWORD || '' }}
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
